  /api/v1/admin/analytics/:
    get:
      operationId: admin_analytics_retrieve
      description: |-
        GET /api/v1/admin/analytics/

        Marketplace-wide analytics for administrators.

        Supported ranges:

            ?range=today
            ?range=7d
            ?range=30d
            ?range=month
            ?range=all

        The selected range controls:

            - Revenue total
            - Average order value
            - Successful orders
            - Total units sold
            - Top products
            - Top sellers
            - Daily revenue
            - Monthly revenue
            - Recent successful sales

        The following remain marketplace-wide:

            - Order status statistics
            - Product inventory statistics
            - User statistics
      parameters:
      - in: query
        name: range
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
